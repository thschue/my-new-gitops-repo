apiVersion: v1
items:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
        argocd.argoproj.io/sync-wave: "5"
      name: debian-presync-01
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: debian-presync
        spec:
          containers:
            - command:
                - sh
                - -c
                - echo PreSync debian starting...; sleep 15; echo PreSync debian done
              image: debian:bookworm-slim
              name: debian
          restartPolicy: Never
  - apiVersion: batch/v1
    kind: Job
    metadata:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
        argocd.argoproj.io/sync-wave: "-1"
      name: debian-presync-02
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: debian-presync
        spec:
          containers:
            - command:
                - sh
                - -c
                - echo PreSync debian starting...; sleep 15; echo PreSync debian done
              image: debian:bookworm-slim
              name: debian
          restartPolicy: Never
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      name: nginx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: nginx
      template:
        metadata:
          labels:
            app: nginx
        spec:
          containers:
            - image: nginx:stable-alpine
              name: nginx
              ports:
                - containerPort: 80
  - apiVersion: v1
    kind: Service
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      name: nginx
    spec:
      ports:
        - port: 80
          targetPort: 80
      selector:
        app: nginx
      type: ClusterIP
  - apiVersion: batch/v1
    kind: Job
    metadata:
      annotations:
        argocd.argoproj.io/hook: PostSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
        argocd.argoproj.io/sync-wave: "1"
      name: debian-postsync
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: debian-postsync
        spec:
          containers:
            - command:
                - sh
                - -c
                - echo PostSync debian starting...; sleep 20; echo PostSync debian done
              image: debian:bookworm-slim
              name: debian
          restartPolicy: Never
kind: List
metadata: {}
